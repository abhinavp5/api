services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    expose:
      - "3000"
    volumes:
      - ./data:/src/data
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    command: tunnel run
    environment:
      - TUNNEL_CONFIG=/etc/cloudflared/config.yml
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:
